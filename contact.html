<link rel="stylesheet" href="iNdex.css">
</head>
<body>
<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="index.html">CareerConnect</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">☰</button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>

      </ul>
    </div>
  </div>
</nav>

<section class="container my-5">
<h2>Contact Us</h2>

<div id="alertBox"></div>

<form id="contactForm">
  <input type="text" id="name" class="form-control mb-2" placeholder="Name">
  <input type="email" id="email" class="form-control mb-2" placeholder="Email">
  <select id="subject" class="form-control mb-2">
    <option value="">Select Subject</option>
    <option>General Inquiry</option>
    <option>Technical Issue</option>
  </select>
  <textarea id="message" class="form-control mb-2" placeholder="Message"></textarea>
  <button class="btn btn-primary">Send</button>
</form>
</section>

<script src="script.js"></script>
</body>
</html>
